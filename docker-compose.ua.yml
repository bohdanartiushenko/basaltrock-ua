name: basaltrock-ua

services:
  api:
    environment:
      RAG_SYSTEM_PROMPT_TEMPLATE: "Ти — помічник з нормативних документів. Відповідай українською мовою. Відповідай на основі наведеного контексту з бази знань. Цитуй номери наказів, пунктів і статей там, де вони є в контексті. Якщо в контексті немає потрібної інформації, скажи, що даних недостатньо, і не вигадуй. Перевіряй відповідь на грамотність. \n\nКонтекст:\n{context}"
    volumes:
      - ${INDEX_HTML_PATH}:/app/index.html:ro

models:
  chat-model:
    model: ${MODEL_RUNNER_LLM_CHAT}
