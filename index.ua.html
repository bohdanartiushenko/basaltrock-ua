<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>База знань</title>
    <link href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%20width%3D%22128%22%20height%3D%22128%22%3E%0A%20%20%3C%21--%20Cube%20-%20top%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C20%20108%2C42%2064%2C64%2020%2C42%22%20fill%3D%22%23636e72%22%2F%3E%0A%20%20%3C%21--%20Cube%20-%20right%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C64%20108%2C42%20108%2C98%2064%2C120%22%20fill%3D%22%233d4447%22%2F%3E%0A%20%20%3C%21--%20Cube%20-%20left%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C64%2020%2C42%2020%2C98%2064%2C120%22%20fill%3D%22%232d3436%22%2F%3E%0A%20%20%3C%21--%20Brain%20outline%20-%20large%20--%3E%0A%20%20%3Cpath%20d%3D%22M34%2C55%20C26%2C59%2022%2C68%2024%2C77%20C25%2C84%2030%2C89%2036%2C91%20C36%2C96%2039%2C102%2046%2C105%20C52%2C108%2059%2C107%2064%2C103%20C69%2C107%2076%2C108%2082%2C105%20C89%2C102%2092%2C96%2092%2C91%20C98%2C89%20103%2C84%20104%2C77%20C106%2C68%20102%2C59%2094%2C55%20C89%2C52%2082%2C52%2076%2C54%20C72%2C51%2068%2C50%2064%2C50%20C60%2C50%2056%2C51%2052%2C54%20C46%2C52%2039%2C52%2034%2C55%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23ffd700%22%20stroke-width%3D%224%22%2F%3E%0A%20%20%3C%21--%20Brain%20folds%20--%3E%0A%20%20%3Cpath%20d%3D%22M38%2C70%20C46%2C66%2054%2C67%2064%2C72%20C74%2C67%2082%2C66%2090%2C70%22%20fill%3D%22none%22%20stroke%3D%22%23005bbb%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M40%2C82%20C48%2C78%2056%2C79%2064%2C84%20C72%2C79%2080%2C78%2088%2C82%22%20fill%3D%22none%22%20stroke%3D%22%23ffd700%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M44%2C93%20C52%2C89%2058%2C90%2064%2C94%20C70%2C90%2076%2C89%2084%2C93%22%20fill%3D%22none%22%20stroke%3D%22%23005bbb%22%20stroke-width%3D%222.5%22%2F%3E%0A%20%20%3C%21--%20Brain%20center%20line%20--%3E%0A%20%20%3Cpath%20d%3D%22M64%2C52%20C64%2C62%2064%2C75%2064%2C101%22%20fill%3D%22none%22%20stroke%3D%22%23ffd700%22%20stroke-width%3D%222.5%22%2F%3E%0A%3C%2Fsvg%3E" rel="icon" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a202c;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2d3748;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="number"] {
            width: 120px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 32px;
            display: none;
        }

        .results.visible {
            display: block;
        }

        .answer {
            background: #f7fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .answer h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #2d3748;
        }

        .answer-text {
            color: #1a202c;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .sources {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }

        .sources h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #2d3748;
        }

        .source-item {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 3px solid #cbd5e0;
        }

        .source-item:last-child {
            margin-bottom: 0;
        }

        .source-meta {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
        }

        .source-text {
            font-size: 14px;
            color: #2d3748;
            line-height: 1.5;
        }

        .error {
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            padding: 16px;
            border-radius: 8px;
            color: #c53030;
            margin-top: 20px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="36" height="36" class="logo">
  <!-- Cube - top face -->
  <polygon points="64,20 108,42 64,64 20,42" fill="#636e72"/>
  <!-- Cube - right face -->
  <polygon points="64,64 108,42 108,98 64,120" fill="#3d4447"/>
  <!-- Cube - left face -->
  <polygon points="64,64 20,42 20,98 64,120" fill="#2d3436"/>
  <!-- Brain outline - large -->
  <path d="M34,55 C26,59 22,68 24,77 C25,84 30,89 36,91 C36,96 39,102 46,105 C52,108 59,107 64,103 C69,107 76,108 82,105 C89,102 92,96 92,91 C98,89 103,84 104,77 C106,68 102,59 94,55 C89,52 82,52 76,54 C72,51 68,50 64,50 C60,50 56,51 52,54 C46,52 39,52 34,55 Z" fill="none" stroke="#ffd700" stroke-width="4"/>
  <!-- Brain folds -->
  <path d="M38,70 C46,66 54,67 64,72 C74,67 82,66 90,70" fill="none" stroke="#005bbb" stroke-width="3"/>
  <path d="M40,82 C48,78 56,79 64,84 C72,79 80,78 88,82" fill="none" stroke="#ffd700" stroke-width="3"/>
  <path d="M44,93 C52,89 58,90 64,94 C70,90 76,89 84,93" fill="none" stroke="#005bbb" stroke-width="2.5"/>
  <!-- Brain center line -->
  <path d="M64,52 C64,62 64,75 64,101" fill="none" stroke="#ffd700" stroke-width="2.5"/>
</svg>База знань</h1>
    <p class="subtitle">Запитуйте про свої документи звичайною мовою</p>

    <form id="searchForm">
        <div class="input-group">
            <label for="question">Питання</label>
            <input
                    autofocus
                    id="question"
                    name="question"
                    placeholder="Що вас цікавить?"
                    required
                    type="text"
            >
        </div>

        <div class="input-group">
            <label for="limit">Кількість джерел (1-30)</label>
            <input
                    id="limit"
                    max="30"
                    min="1"
                    name="limit"
                    type="number"
                    value="5"
            >
        </div>

        <div class="input-group">
            <label for="temperature">Температура (творчість відповіді)</label>
            <input
                    id="temperature"
                    min="0.0"
                    name="temperature"
                    step="0.1"
                    type="number"
                    value="{{ temperature }}"
            >
        </div>

        <div class="input-group">
            <label for="maxtokens">Максимальна довжина відповіді</label>
            <input
                    id="maxtokens"
                    max="1000000"
                    min="1000"
                    name="maxtokens"
                    type="number"
                    value="{{ max_tokens }}"
            >
        </div>

        <div class="input-group">
            <label for="systemPrompt">Системна інструкція (залиште {context})</label>
            <textarea
                    id="systemPrompt"
                    name="systemPrompt"
            >{{ system_prompt }}</textarea>
        </div>

        <button id="submitBtn" type="submit">
            Запитати
        </button>
    </form>

    <div class="results" id="results">
        <div class="answer">
            <h3>Відповідь</h3>
            <div class="answer-text" id="answer"></div>
        </div>

        <div class="sources">
            <h3>Джерела</h3>
            <div id="sources"></div>
        </div>
    </div>

    <div class="error" id="error" style="display: none;"></div>
</div>

<script>
    const form = document.getElementById('searchForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultsDiv = document.getElementById('results');
    const answerDiv = document.getElementById('answer');
    const sourcesDiv = document.getElementById('sources');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const question = document.getElementById('question').value;
        const limit = document.getElementById('limit').value;
        const temperature = document.getElementById('temperature').value;
        const systemPrompt = document.getElementById('systemPrompt').value;
        const maxtokens = document.getElementById('maxtokens').value;

        resultsDiv.classList.remove('visible');
        errorDiv.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>Думаю...';

        try {
            const body = {
                input: {text: question},
                retrieveAndGenerateConfiguration: {
                    type: "KNOWLEDGE_BASE",
                    knowledgeBaseConfiguration: {
                        knowledgeBaseId: "{{ kb_id }}",
                        modelArn: "{{ model_id }}",
                        retrievalConfiguration: {
                            vectorSearchConfiguration: {
                                numberOfResults: parseInt(limit)
                            }
                        },
                        generationConfiguration: {
                            inferenceConfig: {
                                textInferenceConfig: {
                                    temperature: parseFloat(temperature),
                                    maxTokens: parseInt(maxtokens)
                                }
                            },
                            promptTemplate: {
                                textPromptTemplate: systemPrompt
                            }
                        }
                    }
                }
            };

            const response = await fetch('/retrieveAndGenerate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();

            answerDiv.textContent = data.output?.text || 'Відповідь не сформовано';

            sourcesDiv.innerHTML = '';
            const citations = data.citations || [];
            if (citations.length > 0) {
                citations.forEach((citation) => {
                    const ref = citation.retrievedReferences?.[0];
                    if (!ref) return;
                    const sourceEl = document.createElement('div');
                    sourceEl.className = 'source-item';
                    const score = ref.score ? ` | Релевантність: ${(ref.score * 100).toFixed(1)}%` : '';
                    sourceEl.innerHTML = `
                            <div class="source-meta">
                                <strong>${ref.location.s3Location.uri}</strong>${score}
                            </div>
                            <div class="source-text">${escapeHtml(ref.content.text)}</div>
                        `;
                    sourcesDiv.appendChild(sourceEl);
                });
            } else {
                sourcesDiv.innerHTML = '<p style="color: #718096;">Джерел не знайдено</p>';
            }

            resultsDiv.classList.add('visible');

        } catch (error) {
            errorDiv.textContent = `Помилка: ${error.message}`;
            errorDiv.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Запитати';
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
